# Da mettere nel repository GitHub in: .github/workflows/keepalive.yml
name: Supabase keepalive
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://prmyrmpmfavppkbzdqyg.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_M_ihkB0s9phBxPwDwQFd5g_KDzlQmDW" \
            -H "Content-Type: application/json" -d '{}'
