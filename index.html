<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Calcetto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230f3d2e'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23d8f36a' stroke-width='5'/%3E%3C/svg%3E">
<script src="config.js"></script>
<style>
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#eef1ea; --line:#dde3d7; --text:#14201a; --muted:#5f6f66;
  --brand:#0f3d2e; --brand-2:#1d6b4f; --accent:#d8f36a; --accent-ink:#1b2a07;
  --danger:#b3261e; --warn:#a15c00; --ok:#1d7a45;
  --white-team:#ffffff; --white-ink:#14201a; --dark-team:#1f2a33; --dark-ink:#ffffff;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c1210; --surface:#141c18; --surface-2:#1b2520; --line:#26332c; --text:#e8efe9; --muted:#93a59a;
    --brand:#d8f36a; --brand-2:#9fd36b; --accent:#d8f36a; --accent-ink:#13200a;
    --danger:#ff7b72; --warn:#f0b35a; --ok:#6fd49a;
    --white-team:#eef2ee; --white-ink:#111; --dark-team:#000000; --dark-ink:#fff;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.3px;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:#0f3d2e;color:#fff;padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .ball{width:30px;height:30px;border-radius:50%;background:#d8f36a;display:grid;place-items:center;flex:none}
.logo .ball::after{content:"";width:12px;height:12px;border-radius:50%;border:3px solid #0f3d2e}
.logo h1{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.topbar select{max-width:170px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:6px 8px}
.topbar select option{color:#111}
.iconbtn{background:none;border:0;color:inherit;padding:8px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.1)}
/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:#0f3d2e;padding:0 12px 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:0;color:rgba(255,255,255,.75);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;position:relative}
.tab.on{background:#d8f36a;color:#13200a}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff5a4f;color:#fff;font-size:11px;font-weight:700;margin-left:6px}
@media (max-width:720px){
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0;border-top:1px solid rgba(255,255,255,.08)}
  .tab{padding:6px 8px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;min-width:56px}
  .tab .ti{display:block;font-size:18px;line-height:1}
  .tab .badge{position:absolute;top:0;right:4px;margin:0}
  main{padding-bottom:90px}
}
@media (min-width:721px){ .tab .ti{display:none} }
main{padding:18px 0 40px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:22px;margin-bottom:10px}
.rules h3{font-size:19px;margin:16px 0 4px}
.rules ul{margin:4px 0;padding-left:20px}
.rules li{margin:4px 0}
.section-title{display:flex;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.section-title h2{font-size:26px}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
@media (prefers-color-scheme: dark){ .btn.primary{color:#13200a} }
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.t th,.t td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.t th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--surface-2);position:sticky;top:0;cursor:pointer;user-select:none}
.t th.sorted{color:var(--text)}
.t th.sorted::after{content:attr(data-dir);margin-left:3px;font-size:10px}
.t td:first-child,.t th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.t th:first-child{background:var(--surface-2);z-index:2}
.t tr:last-child td{border-bottom:0}
.t tr.me td{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.t td.strong{font-weight:700}
.t .rank{color:var(--muted);font-size:12px;width:26px;display:inline-block}
/* team chips */
.team{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid var(--text);flex:none}
.dot.W{background:var(--white-team)} .dot.D{background:var(--dark-team);border-color:var(--dark-team)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.live{background:var(--accent);color:var(--accent-ink)}
/* match card */
.match{cursor:pointer}
.match .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:10px 0 4px}
.match .score .side{display:flex;flex-direction:column;gap:2px}
.match .score .side.r{align-items:flex-end;text-align:right}
.match .score .num{font-family:'Barlow Condensed',Inter,sans-serif;font-size:38px;font-weight:800;line-height:1;letter-spacing:1px}
.scorers{font-size:13px;color:var(--muted)}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){ .teams-grid{grid-template-columns:1fr} }
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);gap:8px}
.plist li:last-child{border:0}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:721px){ .modal-bg{align-items:center;padding:20px} }
.modal{background:var(--bg);width:100%;max-width:720px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:721px){ .modal{border-radius:18px} }
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.modal header h2{font-size:22px;flex:1}
.modal .body{padding:14px 16px;overflow:auto;flex:1}
.modal footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface);flex-wrap:wrap}
/* picker rows */
.pick{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:13px;min-width:44px}
.tbtn.W.on{background:var(--white-team);color:var(--white-ink);border-color:var(--text)}
.tbtn.D.on{background:var(--dark-team);color:var(--dark-ink);border-color:var(--dark-team)}
.tbtn.sel.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:32px;height:32px;cursor:pointer;font-size:17px;font-weight:700}
.stepper button:active{background:var(--surface-2)}
.stepper span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stat-row{padding:10px 0;border-bottom:1px solid var(--line)}
.stat-row .top{display:flex;align-items:center;gap:8px}
.stat-row .extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}
.stat-row .extra > div{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted)}
.bigscore{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 10px}
.bigscore input{width:78px;text-align:center;font-family:'Barlow Condensed',Inter,sans-serif;font-size:34px;font-weight:800;padding:4px}
.vote-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vote-row .nm{flex:1;min-width:0}
.vote-row select{width:96px;text-align:center;font-weight:700}
.vote-row.done select{border-color:var(--ok)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 50% -10%,#1d6b4f,#0f3d2e 55%,#0a2a20)}
.login .box{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login h1{font-size:30px;line-height:1.05;margin:12px 0 4px}
.login .ball{width:44px;height:44px;border-radius:50%;background:#d8f36a;display:grid;place-items:center}
.login .ball::after{content:"";width:18px;height:18px;border-radius:50%;border:4px solid #0f3d2e}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:20px}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#14201a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1} #toast.bad{background:var(--danger);color:#fff}
@media (max-width:720px){ #toast{bottom:92px}
  .t th,.t td{padding:8px 6px}
  .t .btn.sm{padding:5px 8px;font-size:12px}
  .kpi{padding:10px} .kpi .v{font-size:24px} .kpi .l{font-size:10.5px}
  .card{padding:13px}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-family:'Barlow Condensed',Inter,sans-serif;font-size:30px;font-weight:800;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.up{color:var(--ok);font-weight:700} .down{color:var(--danger);font-weight:700}
.loader{padding:30px;text-align:center;color:var(--muted)}
details.box{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
details.box summary{padding:12px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:10px;list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box > div{padding:0 14px 12px}
/* STOP schieramenti */
.btn.stop{background:#d0021b;border-color:#d0021b;color:#fff;font-weight:800;letter-spacing:.3px}
.btn.stop:hover{background:#a80016}
.stopbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#d0021b 10%,var(--surface));border:1px solid color-mix(in srgb,#d0021b 45%,var(--line))}
.card.stopbar{margin:0 0 14px}
/* import tabellino */
textarea{resize:vertical;font-size:14px}
.imp-row{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--surface)}
.imp-row.flag{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.imp-top{display:flex;gap:6px;align-items:center}
.imp-top select{flex:1;min-width:0}
.imp-nums{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:6px}
.imp-nums label{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.1}
.imp-nums input[type=number]{padding:6px 2px;text-align:center;font-weight:700}
@media (max-width:420px){ .imp-nums{grid-template-columns:repeat(3,minmax(0,1fr))} }
.imp-warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.imp-warn ul{margin:6px 0 0;padding-left:18px;font-size:14px}
/* FantaNunnaree: tema rosa e nero */
html.fanta{
  --bg:#09090b; --surface:#141417; --surface-2:#1e1e23; --line:#2e2e35; --text:#f7f2f5; --muted:#ada4ab;
  --brand:#ff3d9a; --brand-2:#ff79b8; --accent:#ff3d9a; --accent-ink:#ffffff;
  --ok:#5fd39a; --warn:#ffb454; --danger:#ff6b81; --shadow:none;
  --white-team:#f3f3f3; --white-ink:#111; --dark-team:#000; --dark-ink:#fff;
  color-scheme:dark;
}
html.fanta .topbar,html.fanta .tabs{background:#000}
html.fanta .topbar{border-bottom:2px solid #ff3d9a}
html.fanta .tab.on{background:#ff3d9a;color:#fff}
html.fanta .logo .ball{background:#ff3d9a}
html.fanta .logo .ball::after{border-color:#000}
html.fanta .btn.primary{color:#fff}
html.fanta .section-title h2{color:#ff3d9a}
html.fanta .card h2,html.fanta .kpi .v{color:#ff8cc4}
html.fanta .t tr.me td{background:color-mix(in srgb,#ff3d9a 24%,var(--surface))}
html.fanta .seg button.on{background:#ff3d9a;color:#fff;box-shadow:none}
html.fanta .tbtn.sel.on{color:#fff}
html.fanta .dot{border-color:#f7f2f5}
html.fanta .dot.D{border-color:#f7f2f5}
html.fanta #toast{background:#ff3d9a;color:#fff}
/* titolo leggibile su smartphone */
@media (max-width:720px){
  .topbar .wrap{gap:8px}
  .logo{flex:1;gap:8px}
  .logo .ball{width:26px;height:26px}
  .logo .ball::after{width:10px;height:10px;border-width:2.5px}
  .logo h1{font-size:19px;line-height:1.02;white-space:normal;overflow:visible;text-overflow:clip;text-wrap:balance;letter-spacing:.2px}
  .topbar .spacer{display:none}
  .topbar select{max-width:92px;padding:5px 6px;font-size:13px}
  .iconbtn{padding:6px}
}
@media (max-width:350px){ .logo h1{font-size:17px} .logo .ball{width:22px;height:22px} .topbar select{max-width:84px;font-size:12px;padding:4px 3px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
const CFG = window.APP_CONFIG || {};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtVote = v => v == null ? '–' : Number(v).toFixed(2).replace(/0$/, '').replace('.', ',');
const fmtNum = v => v == null ? '–' : String(Math.round(v * 100) / 100).replace('.', ',');
const fmtDate = d => d ? new Date(d + (String(d).length === 10 ? 'T12:00:00' : '')).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtDateTime = d => d ? new Date(d).toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const TYPES = [5, 7, 8, 11];
const TW = CFG.TEAM_W || 'Chiari', TD = CFG.TEAM_D || 'Scuri';
const typeLabel = t => 'Calcio a ' + t;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};

// ------------------------------------------------------------- API
async function rpc(fn, args = {}) {
  const url = CFG.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/rpc/' + fn;
  const headers = { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY };
  if (/^eyJ/.test(CFG.SUPABASE_KEY)) headers.Authorization = 'Bearer ' + CFG.SUPABASE_KEY;
  let res;
  try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(args) }); }
  catch (e) { throw new Error('Connessione non riuscita. Controlla la rete.'); }
  const txt = await res.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch { data = txt; }
  if (!res.ok) {
    const msg = (data && data.message) || ('Errore ' + res.status);
    if (/Sessione scaduta/.test(msg) && S.token) { logoutLocal(); }
    throw new Error(msg);
  }
  return data;
}
const T = () => S.token;

// ------------------------------------------------------------- STATE
const S = {
  token: store.get('calc_token'),
  boot: null, season: null, tab: store.get('calc_tab') || 'classifica',
  matches: null, stats: null, myVotes: null, fanta: null, partners: null,
  ui: { statType: 'all', statSort: { k: 'pg', d: -1 }, statSearch: '', hideZero: true, minPg: 0, matchType: 'all', matchPlayer: null,
        pairPlayer: null, pairB: null, pairType: 'all', pairScope: 'season', pairSort: { k: 'with_pg', d: -1 },
        fantaTab: 'squadra', marketSort: { k: 'price', d: -1 }, marketSearch: '', adminTab: 'giocatori', pricesSort: { k: 'price', d: -1 } }
};
const me = () => S.boot?.me;
const isPres = () => !!S.boot?.me?.is_president;
const pname = id => S.boot?.players.find(p => p.id === id)?.name || ('#' + id);
const activePlayers = () => S.boot.players.filter(p => p.is_active).sort((a, b) => a.name.localeCompare(b.name, 'it'));
const settings = k => Number(S.boot?.settings?.[k]);

function toast(msg, bad = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', bad ? 4200 : 2200);
}
async function act(fn, okMsg) {

// ------------------------------------------------------------- MODAL
function modal({ title, body, actions = [], onOpen, wide }) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" ${wide ? 'style="max-width:900px"' : ''}>
    <header><h2>${esc(title)}</h2><button class="iconbtn" data-x aria-label="Chiudi" style="color:var(--text)">✕</button></header>
    <div class="body">${body}</div>
    ${actions.length ? `<footer>${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-a="${i}">${esc(a.label)}</button>`).join('')}</footer>` : ''}
  </div>`;
  const close = () => { bg.remove(); document.body.style.overflow = ''; };
  bg.addEventListener('click', async e => {
    if (e.target === bg || e.target.closest('[data-x]')) return close();
    const a = e.target.closest('[data-a]');
    if (a) { a.disabled = true; const r = await actions[a.dataset.a].fn(bg); a.disabled = false; if (r) close(); }
  });
  document.body.appendChild(bg); document.body.style.overflow = 'hidden';
  if (onOpen) onOpen(bg, close);
  return { el: bg, close };
}
function confirmBox(text, label = 'Conferma', danger = false) {
  return new Promise(res => {
    const m = modal({ title: 'Confermi?', body: `<p>${text}</p>`, actions: [
      { label: 'Annulla', fn: async () => { res(false); return true; } },
      { label, cls: danger ? 'danger' : 'primary', fn: async () => { res(true); return true; } }
    ] });
    m.el.addEventListener('click', e => { if (e.target === m.el || e.target.closest('[data-x]')) res(false); });
  });
}

// ------------------------------------------------------------- SORTABLE TABLE
function sortRows(rows, sort, cols) {
  const c = cols.find(c => c.k === sort.k) || cols[0];
  const get = c.sv || (r => r[c.k]);
  return [...rows].sort((a, b) => {
    let x = get(a), y = get(b);
    if (typeof x === 'string' || typeof y === 'string') return String(x ?? '').localeCompare(String(y ?? ''), 'it') * sort.d;
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (x - y) * sort.d || String(a.name).localeCompare(String(b.name), 'it');
  });
}
function tableHtml(cols, rows, sort, opts = {}) {
  return `<div class="tbl-wrap"><table class="t"><thead><tr>${cols.map(c => `<th data-k="${c.k}" title="${esc(c.title || c.label)}" class="${sort.k === c.k ? 'sorted' : ''}" data-dir="${sort.d > 0 ? '▲' : '▼'}">${esc(c.label)}</th>`).join('')}</tr></thead>
  <tbody>${rows.length ? rows.map((r, i) => `<tr class="${opts.rowCls ? opts.rowCls(r) : ''}">${cols.map(c => `<td class="${c.cls || ''}">${c.fmt ? c.fmt(r, i) : esc(r[c.k] ?? '')}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="empty">${opts.empty || 'Nessun dato'}</td></tr>`}</tbody></table></div>`;
}
function bindSort(container, sort, rerender) {
  container.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sort.k === k) sort.d = -sort.d; else { sort.k = k; sort.d = k === 'name' ? 1 : -1; }
    rerender();
  });
}
function segHtml(id, opts, val) { return `<div class="seg" id="${id}">${opts.map(o => `<button data-v="${o.v}" class="${String(o.v) === String(val) ? 'on' : ''}">${esc(o.l)}</button>`).join('')}</div>`; }
function bindSeg(el, fn) { el.onclick = e => { const b = e.target.closest('button'); if (b) fn(b.dataset.v); }; }
const typeOpts = [{ v: 'all', l: 'Tutte' }, ...TYPES.map(t => ({ v: t, l: 'a ' + t }))];

    { k: 'gf', label: 'GF', title: 'Gol fatti', cls: 'strong' }, { k: 'rig', label: 'Rig', title: 'Gol su rigore' }, { k: 'ag', label: 'AG', title: 'Autogol' },
    { k: 'gs', label: 'GS', title: 'Gol subiti' }, { k: 'rp', label: 'RP', title: 'Rigori parati' }, { k: 'rs', label: 'RS', title: 'Rigori sbagliati' },

// <PARSER> ---------------------------------------------------- IMPORT TABELLINO: parser puro (testabile)
const normTxt = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[​-‏⁠﻿ ]/g, ' ').toLowerCase();
const MONTHS_IT = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const WORDNUM = { un: 1, uno: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6 };
const NUM_RE = '(\\d+|un|uno|una|due|tre|quattro|cinque|sei)';
const EV_KEYS = ['goals', 'pen_goals', 'own_goals', 'conceded', 'pen_saved', 'pen_missed'];
const emptyEv = () => ({ goals: 0, pen_goals: 0, own_goals: 0, conceded: 0, pen_saved: 0, pen_missed: 0 });

// "Pargalia 2 gol (1 su rigore)" -> { name:'pargalia', ev:{goals:2,pen_goals:1,...}, gk:false, hasEv:true }
function parseEntry(raw) {
  let s = ' ' + normTxt(raw).replace(/[–—]/g, '-').replace(/×/g, 'x') + ' ';
  const ev = emptyEv();
  let gk = false, hasEv = false, goalWord = false;
  const n = x => x == null || x === '' ? 1 : (WORDNUM[x] ?? Number(x));
  const take = (re, fn) => { s = s.replace(re, (...m) => { fn(m); hasEv = true; return ' '; }); };
  s = s.replace(/^\s*\d{1,2}\s*[.)]\s+/, ' ');                                   // "6. Nunnari"
  s = s.replace(/\((?:gk|p|portiere)\)|\bportiere\b|\bgk\b|\bpor\b/g, () => { gk = true; return ' '; });
  const N = NUM_RE;
  take(new RegExp(`(?:${N}\\s*(?:x\\s*)?)?(?:rigor[ei]|rig\\.?)\\s+sbagliat[oi]|sbaglia\\s+(?:${N}\\s+)?rigor[ei]`, 'g'), m => ev.pen_missed += n(m[1] || m[2]));
  take(new RegExp(`(?:${N}\\s*(?:x\\s*)?)?(?:rigor[ei]|rig\\.?)\\s+parat[oi]|para\\s+(?:${N}\\s+)?rigor[ei]`, 'g'), m => ev.pen_saved += n(m[1] || m[2]));
  take(new RegExp(`\\(?\\s*(?:${N}\\s*(?:x\\s*)?)?(?:autogol\\w*|autoret\\w*|aut\\b\\.?|ag\\b)\\s*\\)?`, 'g'), m => ev.own_goals += n(m[1]));
  take(new RegExp(`(?:${N}\\s*(?:gol\\s+|reti\\s+)?subit[ie]|subisce\\s+${N}|\\bgs\\s*:?\\s*${N}|(\\d+)\\s*gs\\b)`, 'g'), m => ev.conceded += n(m[1] || m[2] || m[3] || m[4]));
  take(/(?:^|\s)-\s*(\d+)\s*$/g, m => ev.conceded += Number(m[1]));               // stile "-4" = gol subiti
  take(new RegExp(`(?:${N}\\s*)?(?:gol|goal|reti|rete)\\s+(?:su\\s+|di\\s+|da\\s+)?rigor[ei]|rigor[ei]\\s+segnat[oi]`, 'g'), m => { const k = n(m[1]); ev.goals += k; ev.pen_goals += k; });
  take(/\(\s*r\s*\)/g, () => ev.pen_goals += 1);                                  // "Memolla E. (R)"
  take(new RegExp(`\\(\\s*(?:di\\s+cui\\s+)?(?:${N}\\s*)?(?:su\\s+|di\\s+|da\\s+)?rig\\w*\\.?\\s*\\)`, 'g'), m => ev.pen_goals += n(m[1]));
  take(new RegExp(`,?\\s*(?:di\\s+cui\\s+)?${N}\\s+(?:su\\s+|di\\s+|da\\s+)rig\\w*`, 'g'), m => ev.pen_goals += n(m[1]));
  take(new RegExp(`${N}\\s*(?:gol|goal|goals|reti|rete)\\b|(\\d+)g\\b|\\bx\\s*(\\d+)\\b`, 'g'), m => { ev.goals += n(m[1] || m[2] || m[3]); goalWord = true; });
  take(/\b(doppietta|tripletta|poker|manita|cinquina)\b/g, m => { ev.goals += { doppietta: 2, tripletta: 3, poker: 4, manita: 5, cinquina: 5 }[m[1]]; goalWord = true; });
  take(/\b(?:gol|goal|rete|segna)\b/g, () => { ev.goals += 1; goalWord = true; });
  take(/\brigore\b/g, () => { ev.goals += 1; ev.pen_goals += 1; });              // "Nunnari rigore" = gol su rigore
  take(/(?:^|\s)\+?(\d+)\s*$/g, m => ev.goals += Number(m[1]));                    // "Pargalia 2"
  if (ev.pen_goals > ev.goals) ev.goals = ev.pen_goals;                            // "(1 su rigore)" senza gol: almeno quel gol
  const name = s.replace(/[()\[\]:+*#"]/g, ' ').replace(/\d+/g, ' ').replace(/\s+/g, ' ').replace(/^[\s,.\-]+|[\s,\-]+$/g, '').trim();
  return { name, ev, gk, hasEv, goalWord };
}

// ---- nomi
const nameKey = s => normTxt(s).replace(/['’`]/g, '').replace(/\./g, ' ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function splitDbName(name) { // "De Filippo C." -> {sur:['de','filippo'], ini:'c'} ; "Romano Ma." -> ini 'ma'
  const m = String(name).trim().match(/^(.*?)\s+([A-Za-zÀ-ÿ]{1,3})\.$/);
  return m ? { sur: nameKey(m[1]).split(' '), ini: nameKey(m[2]) } : { sur: nameKey(name).split(' '), ini: '' };
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// ritorna { id|null, status:'ok'|'ambiguo'|'simile'|'nuovo', candidates:[ids], proposed }
function matchPlayer(raw, players, hintGk) {
  const t = nameKey(raw).split(' ').filter(Boolean);
  if (!t.length) return { id: null, status: 'nuovo', candidates: [], proposed: '' };
  const scored = [];
  for (const p of players) {
    const { sur, ini } = splitDbName(p.name); const k = sur.length;
    const iniOk = x => !ini || !x || x.startsWith(ini) || ini.startsWith(x);
    if (t.length >= k && sur.every((w, i) => t[i] === w)) { const r = t[k]; if (iniOk(r)) scored.push({ p, sc: r ? (ini && r.startsWith(ini) ? 3 : 2) : 2 }); continue; }
    if (t.length > k && sur.every((w, i) => t[t.length - k + i] === w) && iniOk(t[0])) scored.push({ p, sc: 2 });   // "Riccardo Pargalia"
  }
  if (scored.length) {
    const best = Math.max(...scored.map(x => x.sc));
    let c = scored.filter(x => x.sc === best).map(x => x.p);
    if (c.length > 1 && c.some(p => p.is_active)) c = c.filter(p => p.is_active);
    if (c.length > 1 && hintGk && c.some(p => p.is_gk)) c = c.filter(p => p.is_gk);
    return { id: c[0].id, status: c.length === 1 ? 'ok' : 'ambiguo', candidates: c.map(p => p.id), proposed: '' };
  }
  // simili (errori di battitura)
  const near = [];
  for (const p of players) {
    const { sur } = splitDbName(p.name); const a = t.slice(0, sur.length).join(' '), b = sur.join(' ');
    const d = lev(a, b), max = b.length >= 7 ? 2 : b.length >= 4 ? 1 : 0;
    if (d <= max) near.push({ p, d });
  }
  near.sort((x, y) => x.d - y.d);
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  const proposed = t.length > 1 && t[t.length - 1].length <= 2 ? t.slice(0, -1).map(cap).join(' ') + ' ' + t[t.length - 1].toUpperCase() + '.' : t.map(cap).join(' ');
  if (near.length) return { id: near[0].p.id, status: 'simile', candidates: near.map(x => x.p.id), proposed };
  return { id: null, status: 'nuovo', candidates: [], proposed };
}

// ---- data / tipo / risultato
function ymd(d) { const x = new Date(d.getTime() + 12 * 3600e3); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; }
function findDate(cell) {
  if (cell instanceof Date && !isNaN(cell)) return ymd(cell);
  if (typeof cell !== 'string') return null;
  const s = normTxt(cell);
  let m = s.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/);
  if (m) { const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]); if (m[2] <= 12 && m[1] <= 31) return `${y}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`; }
  m = s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(new RegExp(`\\b(\\d{1,2})\\s+(${MONTHS_IT.join('|')})\\s+(\\d{4})`));
  if (m) return `${m[3]}-${String(MONTHS_IT.indexOf(m[2]) + 1).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
  return null;
}
function findScoreLine(cell) {
  if (typeof cell !== 'string') return null;
  const s = normTxt(cell).replace(/[–—]/g, '-');
  let m = s.match(/(chiari|bianchi)\D{0,4}(\d+)\s*(?:-|:|a)\s*(\d+)\D{0,4}scuri/); if (m) return [Number(m[2]), Number(m[3])];
  m = s.match(/scuri\D{0,4}(\d+)\s*(?:-|:|a)\s*(\d+)\D{0,4}(chiari|bianchi)/); if (m) return [Number(m[2]), Number(m[1])];
  m = s.match(/^\s*(?:risultato|finale)?\D{0,4}?(\d+)\s*(?:-|:)\s*(\d+)\s*$/); if (m) return [Number(m[1]), Number(m[2])];
  m = s.match(/^\s*(?:risultato|finale)\D{0,4}(\d+)\s*a\s*(\d+)\s*$/); if (m) return [Number(m[1]), Number(m[2])];
  return null;
}
const HDR_RE = /^\s*(chiari|bianchi|scuri)\b[\s:.\-]*(\d+)?\s*(?:gol)?\s*$/;
const STOP_RE = /^\s*(note|lineup|line-up|formazion\w* a cura|campo|centro|stagione)\b/;

function gridFromText(txt, delim) {
  return String(txt).replace(/\r/g, '').split('\n').map(l => delim ? l.split(delim) : l.includes('\t') ? l.split('\t') : [l]);
}

// grid: array di righe, celle string|number|Date|null. players: [{id,name,is_gk,is_active}]
function parseTabellino(grid, players) {
  const G = grid.map(r => (r || []).map(c => c == null ? '' : c instanceof Date ? c : typeof c === 'number' ? c : String(c).trim()));
  const warn = [];
  const hdr = [];
  G.forEach((row, r) => row.forEach((c, ci) => {
    if (typeof c !== 'string' || !c) return;
    const m = normTxt(c).match(HDR_RE);
    if (m) hdr.push({ team: m[1] === 'scuri' ? 'D' : 'W', r, c: ci, score: m[2] != null ? Number(m[2]) : (typeof row[ci + 1] === 'number' ? Math.abs(row[ci + 1]) : null) });
  }));
  const hW = hdr.find(h => h.team === 'W'), hD = hdr.find(h => h.team === 'D');
  if (!hW || !hD) throw new Error('Non trovo le intestazioni delle squadre: servono le parole CHIARI e SCURI (da sole, su una riga o in una cella).');
  if (hdr.filter(h => h.team === 'W').length > 1 || hdr.filter(h => h.team === 'D').length > 1) warn.push('Il file sembra contenere più di una partita: leggo solo la prima. Carica una partita per file.');
  // blocchi
  const blocks = [];
  if (hW.r === hD.r) {                        // affiancati (stile foglio master)
    const [a, b] = hW.c < hD.c ? [hW, hD] : [hD, hW];
    const w = b.c - a.c;
    blocks.push({ h: a, r0: a.r + 1, r1: G.length, c0: a.c, c1: b.c });
    blocks.push({ h: b, r0: b.r + 1, r1: G.length, c0: b.c, c1: b.c + w });
  } else {                                    // uno sotto l'altro (stile testo / PRIME_5)
    const [a, b] = hW.r < hD.r ? [hW, hD] : [hD, hW];
    const right = h => Math.min(h.c + 4, ...hdr.filter(x => x.r === h.r && x.c > h.c).map(x => x.c));
    blocks.push({ h: a, r0: a.r + 1, r1: b.r, c0: a.c, c1: right(a) });
    blocks.push({ h: b, r0: b.r + 1, r1: G.length, c0: b.c, c1: right(b) });
  }
  const score = { W: hW.score, D: hD.score };
  const entries = []; let note = '';
  const inBlock = new Set();
  for (const bl of blocks) {
    const team = bl.h.team; let phase = 'roster';
    for (let r = bl.r0; r < bl.r1; r++) {
      const row = G[r] || [];
      // un'altra intestazione nella stessa colonna chiude il blocco
      const cells = row.slice(bl.c0, bl.c1);
      if (cells.some(c => typeof c === 'string' && HDR_RE.test(normTxt(c)))) break;
      for (let c = bl.c0; c < bl.c1; c++) inBlock.add(r + ':' + c);
      const texts = cells.filter(c => typeof c === 'string' && c), nums = cells.filter(c => typeof c === 'number');
      if (!texts.length && !nums.length) continue;
      const joined = cells.map(c => c instanceof Date ? '' : String(c)).filter(Boolean).join(' ');
      const low = normTxt(joined);
      if (/^\s*note\b/.test(low)) { const t = joined.replace(/^\s*note\s*:?\s*/i, '').trim(); if (t) note += (note ? ' · ' : '') + t; if (hW.r === hD.r) break; continue; }
      if (findDate(joined) && entries.some(e => e.team === team)) break;   // inizia un'altra partita
      if (STOP_RE.test(low.replace(/^["'«\s]+/, '')) || findDate(joined) || findScoreLine(joined)) continue;
      if (/^\s*(marcatori|gol|reti|eventi)\s*:?\s*$/.test(low)) { phase = 'scorers'; continue; }
      if (!texts.length && nums.length) {      // riga col solo numero = risultato (foglio master)
        if (phase === 'roster') { if (score[team] == null) score[team] = Math.abs(nums[0]); phase = 'scorers'; }
        continue;
      }
      let body = joined.replace(/^\s*(marcatori|eventi)\s*:\s*/i, () => { phase = 'scorers'; return ''; });
      const parts = body.split(/[;,](?![^()]*\))/).map(x => x.trim()).filter(Boolean);
      for (const part of parts) {
        const e = parseEntry(part);
        if (!e.name) {                          // "1 su rigore" dopo una virgola: va all'ultimo nome
          const last = entries[entries.length - 1];
          if (last && e.hasEv) { EV_KEYS.forEach(k => last.ev[k] += e.ev[k]); last.raw += ', ' + part; }
          continue;
        }
        if (phase === 'scorers' && !e.hasEv) e.ev.goals = 1;   // elenco marcatori: una riga = un gol
        entries.push({ raw: part, name: e.name, ev: e.ev, gk: e.gk, team, role: phase, row: r });
      }
    }
  }
  // dati fuori dai blocchi: data, tipo, risultato, note
  let date = null, type = null;
  G.forEach((row, r) => row.forEach((c, ci) => {
    if (!date) date = findDate(c);
    if (typeof c === 'string') {
      const s = normTxt(c);
      const t = s.match(/calcio\s*a\s*(5|7|8|11)\b|\bc\s*(5|7|8|11)\b|\b(5|7|8|11)\s*(?:vs|contro)\s*(5|7|8|11)\b/);
      if (!type && t) type = Number(t[1] || t[2] || t[3]);
      const sl = findScoreLine(c); if (sl && score.W == null && score.D == null) { score.W = sl[0]; score.D = sl[1]; }
      if (!inBlock.has(r + ':' + ci) && /^\s*note\s*:/.test(s)) { const t2 = c.replace(/^\s*note\s*:\s*/i, '').trim(); if (t2 && !note.includes(t2)) note += (note ? ' · ' : '') + t2; }
    }
  }));
  // risoluzione nomi + aggregazione per giocatore
  const byKey = new Map(); const rows = [];
  for (const e of entries) {
    const m = matchPlayer(e.name, players, e.gk || e.ev.pen_saved > 0 || e.ev.conceded > 0);
    const key = m.id != null ? 'id' + m.id : 'new:' + nameKey(m.proposed || e.name);
    let row = byKey.get(key);
    if (!row) {
      row = { key, pid: m.id, status: m.status, candidates: m.candidates, newName: m.id == null ? (m.proposed || e.name) : '', team: null, teamFromScorer: null, ev: emptyEv(), gk: false, raws: [] };
      byKey.set(key, row); rows.push(row);
    }
    if (e.role === 'roster') {
      if (row.team && row.team !== e.team) {
        const onlyEv = !e.ev.goals && (e.ev.own_goals || e.ev.pen_missed || e.ev.pen_saved || e.ev.conceded);
        if (!onlyEv) warn.push(`${e.raw}: compare in entrambe le squadre, lasciato in ${row.team === 'W' ? 'Chiari' : 'Scuri'}. Controlla.`);
      } else row.team = row.team || e.team;
    } else row.teamFromScorer = row.teamFromScorer || e.team;
    EV_KEYS.forEach(k => row.ev[k] += e.ev[k]);
    row.gk = row.gk || e.gk; row.raws.push(e.raw);
  }
  for (const row of rows) if (!row.team) {
    row.team = row.ev.own_goals ? (row.teamFromScorer === 'W' ? 'D' : 'W') : row.teamFromScorer || 'W';
    warn.push(`${row.raws[0]}: non è nelle formazioni, messo in ${row.team === 'W' ? 'Chiari' : 'Scuri'}. Controlla.`);
  }
  for (const row of rows) { const p = players.find(x => x.id === row.pid); if (p && p.is_gk) row.gk = true; }
  // eventi scritti nelle note: "rigore parato da Nunnari E. a Caruso L."
  for (const m of normTxt(note).matchAll(/rigor[ei]\s+parat[oi]\s+da\s+([a-z' .]+?)\s+a\s+([a-z' .]+?)(?:[,;]|\.(?:\s|$)|$)/g)) {
    const find = nmx => { const mm = matchPlayer(nmx, players); return rows.find(r => r.pid != null && r.pid === mm.id); };
    const gkRow = find(m[1]), shRow = find(m[2]);
    if (gkRow && !gkRow.ev.pen_saved) { gkRow.ev.pen_saved = 1; gkRow.raws.push('nota: rigore parato'); }
    if (shRow && !shRow.ev.pen_missed) { shRow.ev.pen_missed = 1; shRow.raws.push('nota: rigore sbagliato'); }
    if (gkRow || shRow) warn.push('Rigore parato/sbagliato letto dalle note: verifica.');
  }
  // tipo dedotto dal numero di giocatori
  const nW = rows.filter(r => r.team === 'W').length, nD = rows.filter(r => r.team === 'D').length, nMax = Math.max(nW, nD);
  const typeGuess = nMax >= 10 ? 11 : nMax >= 8 ? 8 : nMax >= 7 ? 7 : 5;
  if (!type) type = typeGuess; else if (type !== typeGuess && !(type === 8 && nMax === 7)) warn.push(`Il file dice calcio a ${type} ma le squadre hanno ${nW} e ${nD} giocatori.`);
  // risultato calcolato
  const calc = { W: 0, D: 0 };
  rows.forEach(r => { calc[r.team] += r.ev.goals; calc[r.team === 'W' ? 'D' : 'W'] += r.ev.own_goals; });
  if (score.W == null || score.D == null) { score.W = score.W ?? calc.W; score.D = score.D ?? calc.D; warn.push('Risultato non indicato nel file: calcolato dai marcatori.'); }
  else if (score.W !== calc.W || score.D !== calc.D) warn.push(`Il risultato del file (${score.W}–${score.D}) non coincide con i marcatori (${calc.W}–${calc.D}).`);
  // gol subiti al portiere se non indicati
  for (const t of ['W', 'D']) {
    const tr = rows.filter(r => r.team === t);
    if (tr.some(r => r.ev.conceded)) continue;
    const gks = tr.filter(r => r.gk);
    const opp = t === 'W' ? score.D : score.W;
    if (gks.length === 1) { gks[0].ev.conceded = opp; gks[0].autoConceded = true; }
    else if (opp > 0) warn.push(`${t === 'W' ? 'Chiari' : 'Scuri'}: ${gks.length ? 'più portieri' : 'nessun portiere (GK)'} indicato, gol subiti non assegnati. Inseriscili a mano se serve.`);
  }
  rows.forEach(r => { if (r.ev.pen_goals > r.ev.goals) r.ev.goals = r.ev.pen_goals; });
  return { date, type, score, note, rows, warn };
}

const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return loadXlsx._p ||= new Promise((ok, ko) => {
    const s = document.createElement('script'); s.src = XLSX_URL; s.onload = ok;
    s.onerror = () => { loadXlsx._p = null; s.remove(); ko(new Error('Non riesco a caricare il lettore Excel: controlla la connessione, oppure salva il file come .csv o incolla il testo.')); };
    document.head.appendChild(s);
  });
}
async function fileToGrid(file) {
  const n = file.name.toLowerCase();
  if (/\.(xlsx|xlsm|xlsb|xls|ods)$/.test(n)) {
    await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const sheets = wb.SheetNames.map(sn => XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null, blankrows: true }));
    const has = g => g.some(r => (r || []).some(c => typeof c === 'string' && /^\s*(chiari|bianchi|scuri)\b/i.test(c)));
    return sheets.find(has) || sheets[0] || [];
  }
  if (/\.(docx?|pdf|pages|numbers)$/.test(n)) throw new Error('Questo formato non si legge: apri il file, copia il testo e incollalo nel riquadro qui sotto.');
  const txt = await file.text();
  if (/\.csv$/.test(n)) { const d = (txt.match(/;/g) || []).length >= (txt.match(/,/g) || []).length ? ';' : ','; return gridFromText(txt, d); }
  return gridFromText(txt);
}

      <div class="err" id="impErr"></div>`,

        <input type="number" min="0" id="isw" value="${res.score.W ?? ''}" inputmode="numeric"><b>–</b><input type="number" min="0" id="isd" value="${res.score.D ?? ''}" inputmode="numeric">

    actions: [{ label: 'Salva partita', cls: 'primary', fn: el => saveImport(el) }],
    onOpen: el => {

        $('#impMeta', el).innerHTML = m

             <div class="grid2"><div><label class="f" for="impDate">Data</label><input type="date" id="impDate" value="${st.date}"></div>

    for (const r of rows) {

      if (r.pen_goals > r.goals) { toast(`${nameOf(r)}: gol su rigore più dei gol`, true); return false; }
    }

    const dup = keys.find((k, i) => keys.indexOf(k) !== i);

    const news = rows.filter(r => r.pid == null);

    try {
      for (const r of news) {
        const nm = nameOf(r);
        const ex = S.boot.players.find(p => p.name.toLowerCase() === nm.toLowerCase());
        if (ex) { r.pid = ex.id; continue; }
        if (!created.players[nm]) created.players[nm] = (await rpc('admin_add_player', { p_token: T(), p_name: nm, p_is_gk: !!r.gk })).id;
        r.pid = created.players[nm];
      }
      if (news.length) S.boot = await rpc('get_bootstrap', { p_token: T() });
      let mid = m ? m.id : created.match;
      if (!mid) mid = created.match = (await rpc('admin_create_match', { p_token: T(), p_type: type, p_date: date, p_note: st.note })).id;
      const stats = rows.map(r => ({ player_id: r.pid, team: r.team, goals: r.goals, pen_goals: r.pen_goals, own_goals: r.own_goals, conceded: r.conceded, pen_saved: r.pen_saved, pen_missed: r.pen_missed }));
      await rpc('admin_save_result', { p_token: T(), p_match: mid, p_score_w: Number(sw), p_score_d: Number(sd), p_stats: stats, p_open_votes: openVotes });
      toast('Partita importata e salvata');
      await refreshAll();
      if (S.tab === 'partite' && S.matches?.list.some(x => x.id === mid)) openMatch(mid);
      return true;
    } catch (e) {
      toast(e.message + (created.match ? ' (la partita è stata creata: riprova a salvare)' : ''), true);
      return false;
    }
  }
}

async function loadFanta(force) {

// Ruolo P: se nessun portiere ha giocato -> voto d'ufficio; se il mio portiere ha giocato -> il suo punteggio;
// se il mio portiere non ha giocato -> il punteggio peggiore tra i portieri che hanno giocato.
function giornataScores(g) {
  const pts = {}; g.points.forEach(p => pts[p.player_id] = p);
  const played = g.status === 'giocata';
  const score = p => (p.voto == null ? 0 : Number(p.voto)) + Number(p.bonus);
  const gks = g.points.filter(p => p.is_gk);
  return g.lineups.map(l => {
    let tot = 0, pending = false;
    const det = l.players.map(pid => {
      const p = pts[pid];
      if (!p) return { pid, played: false, v: played ? 0 : null };
      if (p.pending) pending = true;
      const v = score(p); tot += v;
      return { pid, played: true, voto: p.voto, bonus: Number(p.bonus), pending: p.pending, v };
    });
    let gk = null;
    if (l.gk != null) {
      const own = pts[l.gk];
      if (!played) gk = { pid: l.gk, mode: 'wait', v: null };
      else if (own && own.is_gk) { gk = { pid: l.gk, mode: 'own', voto: own.voto, bonus: Number(own.bonus), pending: own.pending, v: score(own) }; if (own.pending) pending = true; }
      else if (gks.length) {
        const worst = gks.reduce((a, b) => score(b) < score(a) ? b : a);
        gk = { pid: l.gk, mode: 'sub', sub: worst.player_id, voto: worst.voto, bonus: Number(worst.bonus), pending: worst.pending, v: score(worst) };
        if (worst.pending) pending = true;
      } else gk = { pid: l.gk, mode: 'ufficio', v: settings('fanta_gk_ufficio') };
      if (gk.v != null) tot += gk.v;
    } else if (played) gk = { pid: null, mode: 'none', v: 0 };
    const goals = det.reduce((a, d) => a + (d.played ? Number(pts[d.pid]?.goals || 0) : 0), 0) + (gk && gk.mode === 'own' ? Number(pts[gk.pid]?.goals || 0) : 0);
    return { owner: l.owner_id, total: Math.round(tot * 100) / 100, det, gk, goals, pending: pending || !played };
  }).sort((a, b) => b.total - a.total || b.goals - a.goals || pname(a.owner).localeCompare(pname(b.owner), 'it'));
}

    const rosterRows = mine.roster.map(r => ({ ...r, name: pname(r.player_id), now: price[r.player_id]?.price ?? r.buy_price })).sort((a, b) => b.now - a.now);
    const gkList = S.boot.players.filter(p => p.is_gk && p.is_active).sort((a, b) => a.name.localeCompare(b.name, 'it'));
    const movSize = lineupSize - 1;
    fv.innerHTML = head + open.map(g => {
      const mineL = g.lineups.find(l => l.owner_id === me().id) || {};
      const lu = mineL.players || [], myGk = mineL.gk ?? null;
      return `<div class="card" data-g="${g.match_id}"><div class="row"><h2 style="margin:0">Formazione · ${esc(typeLabel(g.type))}</h2><span class="muted small">${esc(fmtDate(g.date))}</span><div class="spacer"></div><span class="pill live" data-cnt>${(myGk != null ? 1 : 0) + lu.length}/${lineupSize}</span></div>
        <div class="tiny muted" style="margin:4px 0 8px">1 portiere (P) + ${movSize} di movimento. Chi non gioca prende 0. Se il tuo portiere non gioca prendi il punteggio peggiore tra i portieri in campo; se in campo non c'è nessun portiere, ${settings('fanta_gk_ufficio')} d'ufficio.</div>
        <h3 style="font-size:17px;margin:10px 0 2px">Portiere (P) <span class="tiny muted">· sempre disponibili, non si comprano</span></h3>
        ${gkList.map(p => `<div class="pick"><span class="nm">${esc(p.name)}</span><button class="tbtn sel ${myGk === p.id ? 'on' : ''}" data-gk="${p.id}">${myGk === p.id ? 'In porta' : 'Scegli'}</button></div>`).join('') || '<div class="muted small">Nessun portiere segnato GK.</div>'}
        <h3 style="font-size:17px;margin:14px 0 2px">Movimento <span class="tiny muted" data-mcnt>${lu.length}/${movSize}</span></h3>
        ${rosterRows.length ? rosterRows.map(r => `<div class="pick"><span class="nm">${esc(r.name)}</span><button class="tbtn sel ${lu.includes(r.player_id) ? 'on' : ''}" data-lu="${r.player_id}">${lu.includes(r.player_id) ? 'In campo' : 'Schiera'}</button></div>`).join('') : '<div class="muted small">Prima compra i giocatori nel Mercato.</div>'}
        <div class="row" style="margin-top:10px"><div class="spacer"></div><button class="btn primary" data-savelu>Salva formazione</button></div></div>`;
    }).join('') + `<div class="card"><div class="row"><h2 style="margin:0">La mia rosa</h2><div class="spacer"></div>${canTrade ? '<button class="btn accent sm" data-gomarket>Vai al mercato</button>' : ''}</div>
      ${rosterRows.length ? `<div class="tbl-wrap" style="margin-top:10px"><table class="t"><thead><tr><th>Giocatore</th><th>Pagato</th><th>Ora</th><th></th></tr></thead><tbody>
        ${rosterRows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.buy_price}</td><td><b>${r.now}</b> ${r.now > r.buy_price ? `<span class="up">▲${r.now - r.buy_price}</span>` : r.now < r.buy_price ? `<span class="down">▼${r.buy_price - r.now}</span>` : ''}</td>
          <td>${canTrade ? `<button class="btn sm danger" data-sell="${r.player_id}">Cedi</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Rosa vuota. Hai ' + settings('fanta_budget') + ' crediti per ' + rosterSize + ' giocatori.</div>'}
      <div class="tiny muted" style="margin-top:8px">${F.free_phase ? 'Fino alla prima giornata FantaNunnaree puoi cedere e ricomprare liberamente con rimborso pieno.' : `Ogni cessione usa 1 dei ${maxCh} cambi e ti restituisce il valore attuale del giocatore.`}</div></div>`;
    fv.onclick = async e => {
      if (e.target.closest('[data-gomarket]')) { u.fantaTab = 'mercato'; return viewFanta(v); }
      const lu = e.target.closest('[data-lu]');
      const upd = c => { const nm = $$('[data-lu].on', c).length, ng = $$('[data-gk].on', c).length; c.querySelector('[data-cnt]').textContent = `${nm + ng}/${lineupSize}`; c.querySelector('[data-mcnt]').textContent = `${nm}/${lineupSize - 1}`; };
      if (lu) { const c = lu.closest('.card'); const on = !lu.classList.contains('on'); if (on && $$('[data-lu].on', c).length >= lineupSize - 1) return toast(`Massimo ${lineupSize - 1} giocatori di movimento`, true); lu.classList.toggle('on', on); lu.textContent = on ? 'In campo' : 'Schiera'; upd(c); return; }
      const gb = e.target.closest('[data-gk]');
      if (gb) { const c = gb.closest('.card'); const on = !gb.classList.contains('on'); $$('[data-gk]', c).forEach(x => { x.classList.remove('on'); x.textContent = 'Scegli'; }); if (on) { gb.classList.add('on'); gb.textContent = 'In porta'; } upd(c); return; }
      const sv = e.target.closest('[data-savelu]');
      if (sv) { const c = sv.closest('.card'); const ids = $$('[data-lu].on', c).map(b => Number(b.dataset.lu)); const gkb = $('[data-gk].on', c); const gk = gkb ? Number(gkb.dataset.gk) : null;
        if (!gk && !await confirmBox('Non hai scelto il portiere (P): il ruolo varrà 0. Salvo lo stesso?', 'Salva')) return;
        if (ids.length < lineupSize - 1 && !await confirmBox(`Hai schierato ${ids.length} giocatori di movimento su ${lineupSize - 1}. I posti vuoti valgono 0. Salvo?`, 'Salva')) return;
        if (await act(() => rpc('fanta_set_lineup', { p_token: T(), p_match: Number(c.dataset.g), p_players: ids, p_gk: gk }), 'Formazione salvata')) { await loadFanta(true); } return; }
      const sl = e.target.closest('[data-sell]');
      if (sl) { const pid = Number(sl.dataset.sell); const msg = F.free_phase ? `Cedere ${esc(pname(pid))}? Mercato libero: rimborso pieno, nessun cambio usato.` : `Cedere ${esc(pname(pid))} per ${price[pid]?.price} crediti? Userai 1 cambio (te ne restano ${maxCh - mine.changes_used - 1}).`;
        if (!await confirmBox(msg, 'Cedi', true)) return; if (await act(() => rpc('fanta_sell', { p_token: T(), p_player: pid }), 'Ceduto')) { await loadFanta(true); viewFanta(v); } }
    };
  }

  if (u.fantaTab === 'mercato') {
    const inRoster = new Set(mine.roster.map(r => r.player_id));
    const cols = [
      { k: 'name', label: 'Giocatore' },
      { k: 'price', label: 'Prezzo', cls: 'strong' },
      { k: 'delta', label: 'Var.', title: 'Variazione rispetto alla quotazione di inizio stagione', fmt: r => r.delta > 0 ? `<span class="up">+${r.delta}</span>` : r.delta < 0 ? `<span class="down">${r.delta}</span>` : '<span class="muted">0</span>' },
      { k: 'pres', label: 'PG', title: 'Presenze stagione (calcio a 8 e 11)' },
      { k: 'act', label: '', fmt: r => inRoster.has(r.id) ? '<span class="pill ok">In rosa</span>' : canTrade ? `<button class="btn sm ${r.price <= mine.credits && mine.roster.length < rosterSize ? 'accent' : ''}" data-buy="${r.id}" ${r.price > mine.credits || mine.roster.length >= rosterSize ? 'disabled' : ''}>Compra</button>` : '' },
    ];
    const rowsAll = F.prices.map(p => ({ ...p, name: pname(p.id), delta: p.price - p.base }));
    fv.innerHTML = head + `<div class="row" style="margin-bottom:10px"><input type="text" id="mq" placeholder="Cerca giocatore…" value="${esc(u.marketSearch)}" style="max-width:260px"><span class="tiny muted">Le quotazioni si aggiornano dopo ogni partita in base alla stagione in corso.</span></div><div id="mt"></div>`;
    const draw = () => {
      let rows = rowsAll; if (u.marketSearch) rows = rows.filter(r => r.name.toLowerCase().includes(u.marketSearch.toLowerCase()));
      $('#mt').innerHTML = tableHtml(cols, sortRows(rows, u.marketSort, cols), u.marketSort, { rowCls: r => inRoster.has(r.id) ? 'me' : '' });
      bindSort($('#mt'), u.marketSort, draw);
    };
    draw();
    $('#mq').oninput = e => { u.marketSearch = e.target.value; draw(); };
    fv.onclick = async e => { const b = e.target.closest('[data-buy]'); if (!b) return; const pid = Number(b.dataset.buy);
      if (await act(() => rpc('fanta_buy', { p_token: T(), p_player: pid }), `${pname(pid)} acquistato`)) { await loadFanta(true); viewFanta(v); } };
  }

  if (u.fantaTab === 'giornate') {
    if (!F.giornate.length) { fv.innerHTML = '<div class="card empty">Nessuna giornata FantaNunnaree. Il presidente sblocca gli schieramenti dalla scheda di una partita a 8 o a 11.</div>'; return; }
    fv.innerHTML = F.giornate.map(g => {
      const sc = giornataScores(g);
      const state = g.state === 'aperto' ? '<span class="pill live">Schieramenti aperti</span>' : g.status !== 'giocata' ? '<span class="pill warn">In attesa del risultato</span>' : g.final ? '<span class="pill ok">Definitiva</span>' : '<span class="pill warn">Provvisoria: voti in corso</span>';
      return `<details class="box" ${g === F.giornate[0] ? 'open' : ''}><summary><b>${esc(typeLabel(g.type))}</b><span class="muted small">${esc(fmtDate(g.date))}${g.status === 'giocata' ? ` · ${g.score_w}–${g.score_d}` : ''}</span><div class="spacer"></div>${state}</summary><div>
        ${sc.length ? '<div class="tiny muted" style="margin-bottom:8px">Classifica della giornata tra le squadre fanta. Tocca una squadra per vedere i punti dei suoi giocatori schierati.</div>' : ''}${sc.length ? sc.map((s, i) => `<details class="box"><summary><span class="rank">${i + 1}</span><span style="flex:1">Squadra di <b>${esc(pname(s.owner))}</b>${s.owner === me().id ? ' <span class="pill live">tu</span>' : ''}</span><b>${fmtNum(s.total)} pt</b></summary><div><ul class="plist">
          ${s.gk ? `<li><span><span class="pill">P</span> ${s.gk.pid ? esc(pname(s.gk.pid)) : '<span class="muted">nessun portiere scelto</span>'}${s.gk.mode === 'sub' ? `<br><span class="tiny muted">non ha giocato: preso il peggiore in campo, ${esc(pname(s.gk.sub))}</span>` : s.gk.mode === 'ufficio' ? `<br><span class="tiny muted">nessun portiere in campo: ${settings('fanta_gk_ufficio')} d'ufficio</span>` : ''}</span>
            <span class="small">${s.gk.mode === 'wait' ? '<span class="muted">–</span>' : s.gk.mode === 'ufficio' || s.gk.mode === 'none' ? `<b>${fmtNum(s.gk.v)}</b>` : `voto ${s.gk.pending ? '<span class="muted">in attesa</span>' : fmtVote(s.gk.voto)} ${s.gk.bonus ? (s.gk.bonus > 0 ? '+' : '') + fmtNum(s.gk.bonus) : ''} = <b>${fmtNum(s.gk.v)}</b>`}</span></li>` : ''}
          ${s.det.map(d => `<li><span>${esc(pname(d.pid))}</span><span class="small">${!d.played ? (g.status === 'giocata' ? '<span class="muted">non ha giocato · 0</span>' : '<span class="muted">–</span>') : `voto ${d.pending ? '<span class="muted">in attesa</span>' : fmtVote(d.voto)} ${d.bonus ? (d.bonus > 0 ? '+' : '') + fmtNum(d.bonus) : ''} = <b>${fmtNum(d.v)}</b>`}</span></li>`).join('')}
        </ul></div></details>`).join('') : '<div class="muted small">Nessuna formazione schierata.</div>'}
        ${!g.final && g.status === 'giocata' ? '<div class="tiny muted">I voti contano alla chiusura delle votazioni: fino ad allora vedi solo bonus e malus.</div>' : ''}
      </div></details>`;
    }).join('');
    fv.onclick = null;
  }

  if (u.fantaTab === 'classifica') {
    const tot = {};
    F.owners.forEach(o => tot[o.owner_id] = { id: o.owner_id, name: pname(o.owner_id), pts: 0, g: 0, gol: 0, best: null, prov: false });
    F.giornate.filter(g => g.state === 'bloccato' && g.status === 'giocata').forEach(g => giornataScores(g).forEach(s => {
      const t = tot[s.owner] ||= { id: s.owner, name: pname(s.owner), pts: 0, g: 0, gol: 0, best: null, prov: false };
      t.pts += s.total; t.g++; t.gol += s.goals; t.best = Math.max(t.best ?? -Infinity, s.total); if (!g.final) t.prov = true;
    }));
    const rows = Object.values(tot).sort((a, b) => (Math.round(b.pts * 100) - Math.round(a.pts * 100)) || b.gol - a.gol || a.name.localeCompare(b.name, 'it'));
    fv.innerHTML = rows.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Squadra</th><th>Punti</th><th>Gol</th><th>Giornate</th><th>Migliore</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr class="${r.id === me().id ? 'me' : ''}"><td><span class="rank">${i + 1}</span>${esc(r.name)}</td><td class="strong">${fmtNum(Math.round(r.pts * 100) / 100)}${r.prov ? ' <span class="tiny muted">prov.</span>' : ''}</td><td>${r.gol}</td><td>${r.g}</td><td>${r.best == null ? '–' : fmtNum(r.best)}</td></tr>`).join('')}
      </tbody></table></div><div class="legend">Classifica cumulativa della stagione. A parità di punti vince chi ha più gol segnati dai giocatori schierati; poi ordine alfabetico. “prov.” = una giornata ha ancora le votazioni aperte.</div>` : '<div class="card empty">Ancora nessuna squadra.</div>';
    fv.onclick = null;
  }

  if (u.fantaTab === 'squadre') {
    const owners = [...F.owners].sort((a, b) => pname(a.owner_id).localeCompare(pname(b.owner_id), 'it'));
    fv.innerHTML = owners.length ? owners.map(o => `<details class="box"><summary><span style="flex:1">${esc(pname(o.owner_id))}</span><span class="small muted">${o.roster.length}/${rosterSize} · ${fmtNum(o.credits)} cr</span></summary><div><ul class="plist">
      ${o.roster.map(r => ({ ...r, now: price[r.player_id]?.price ?? r.buy_price })).sort((a, b) => b.now - a.now).map(r => `<li><span>${esc(pname(r.player_id))}</span><span class="small">pagato ${r.buy_price} · ora <b>${r.now}</b></span></li>`).join('')}
      </ul></div></details>`).join('') : '<div class="card empty">Ancora nessuna squadra.</div>';
    fv.onclick = null;
  }

  if (u.fantaTab === 'regole') {
    const st = k => fmtNum(settings(k));
    const gb = settings('fanta_goal_bonus'), cs = settings('fanta_conceded_step'), cm = settings('fanta_conceded_malus'), ps = settings('fanta_pen_saved_bonus'), pm = settings('fanta_pen_missed_malus'), wb = settings('fanta_win_noscore_bonus'), ogm = settings('fanta_own_goal_malus');
    const ex1 = 6.5 + 2 * gb, ex2 = 6 - Math.floor(7 / cs) * cm + ps, ex3 = 6.25 + wb;
    fv.innerHTML = `<div class="card rules"><h2>Regolamento FantaNunnaree</h2>
      <p class="small muted">I numeri in grassetto sono quelli impostati ora dai presidenti (Area presidente → Impostazioni). Se cambiano, cambia anche questo regolamento e i punteggi vengono ricalcolati, anche quelli passati.</p>

      <h3>1. Chi gioca e quando</h3><ul>
      <li>Può partecipare chiunque abbia accesso all'app, anche chi non scende in campo.</li>
      <li>Il FantaNunnaree vale solo per le partite di <b>calcio a 8 e calcio a 11</b>. Calcio a 5 e calcio a 7 non hanno giornata fanta (nel calcio a 7 si vota, ma non conta per il fanta).</li>
      <li>Una partita diventa una <b>giornata</b> solo quando un presidente sblocca gli schieramenti dalla scheda partita. Se una partita viene cambiata in calcio a 5 o a 7, la giornata viene annullata e le formazioni cancellate.</li></ul>

      <h3>2. La rosa e il mercato</h3><ul>
      <li>Ogni squadra ha <b>${st('fanta_budget')} crediti</b> per comprare fino a <b>${rosterSize} giocatori di movimento</b>.</li>
      <li>Lo stesso giocatore può essere nella rosa di più squadre: non ci sono esclusive.</li>
      <li>I <b>portieri (GK) non si comprano</b>: sono sempre disponibili a tutti per il ruolo P. Chi è GK lo decidono i presidenti.</li>
      <li>Si paga il prezzo del momento dell'acquisto, che resta fisso come “prezzo pagato”.</li>
      <li><b>Mercato libero</b>: finché non si chiude la prima giornata della stagione (STOP o risultato inserito) puoi comprare e cedere quanto vuoi, con rimborso pieno del prezzo pagato e senza usare cambi.</li>
      <li><b>Dopo</b>: hai <b>${maxCh} cambi</b> per tutta la stagione. Ogni cessione usa 1 cambio e ti restituisce il <b>valore attuale</b> del giocatore (può essere più o meno di quanto l'hai pagato). Gli acquisti non consumano cambi, ma servono crediti e un posto libero in rosa. Finiti i cambi non puoi più cedere.</li>
      <li>Crediti disponibili = ${st('fanta_budget')} − prezzi pagati + incassi delle cessioni.</li>
      <li>Se cedi un giocatore schierato in una giornata ancora aperta, viene tolto da quella formazione.</li>
      <li>A stagione terminata il mercato è chiuso.</li></ul>

      <h3>3. Le quotazioni</h3><ul>
      <li>Ogni giocatore parte da una <b>quotazione base</b> di inizio stagione, calcolata sulla stagione precedente e approvata dai presidenti (che possono correggerla).</li>
      <li>Dopo ogni partita a 8 o a 11 il prezzo si aggiorna in base alla stagione in corso: <b>punti attesi</b> = (partite giocate dal giocatore ÷ partite disputate) × media dei suoi punti fanta (voto, o ${st('fanta_voto_ufficio')} d'ufficio, + bonus/malus).</li>
      <li>Prezzo dalla stagione = 1 + (punti attesi − 1)², arrotondato, minimo 1 e massimo <b>${st('price_max')}</b>.</li>
      <li>Prezzo attuale = mix tra base e prezzo dalla stagione: il peso della stagione cresce del ${fmtNum(100 / settings('price_blend_matches'))}% a partita; dopo <b>${st('price_blend_matches')} partite</b> conta solo la stagione. Chi non gioca mai scende partita dopo partita verso 1.</li>
      <li>Le partite che i presidenti escludono dalle quotazioni (per esempio le prime 5 del 2026-27) non contano.</li></ul>

      <h3>4. La formazione</h3><ul>
      <li>A ogni giornata schieri <b>1 portiere (P)</b> scelto tra tutti i GK + <b>${lineupSize - 1} giocatori di movimento</b> della tua rosa.</li>
      <li>Puoi modificarla quante volte vuoi finché gli schieramenti sono aperti. Le formazioni sono visibili a tutti.</li>
      <li>Gli schieramenti si chiudono quando un presidente preme <b>STOP</b> (da fare prima del calcio d'inizio) o, al più tardi, quando viene inserito il risultato. Dopo, nessuno può più cambiare: l'app lo blocca.</li>
      <li>Se non salvi una formazione, quella giornata prendi 0. I posti lasciati vuoti valgono 0.</li></ul>

      <h3>5. Il punteggio di ogni giocatore</h3><ul>
      <li><b>Chi non gioca</b> la partita prende <b>0</b>.</li>
      <li><b>Voto</b>: media dei voti ricevuti dagli altri giocatori della partita (da 0 a 10, passi di 0,25). Vale solo se ha ricevuto <b>almeno ${st('min_votes')} voti</b>, altrimenti prende <b>${st('fanta_voto_ufficio')} d'ufficio</b>.</li>
      <li>Il voto entra solo alla chiusura delle votazioni (<b>${st('vote_hours')} ore</b> dopo il risultato). Prima vedi solo bonus e malus e la giornata è “provvisoria”.</li>
      <li><b>+${fmtNum(gb)}</b> per ogni gol segnato (anche su rigore).</li>
      <li><b>−${fmtNum(cm)}</b> ogni <b>${fmtNum(cs)}</b> gol subiti, per difetto (0–${cs - 1} subiti: 0; ${cs}–${2 * cs - 1}: −${fmtNum(cm)}; ${2 * cs}–${3 * cs - 1}: −${fmtNum(2 * cm)}…). Vale per chi ha gol subiti assegnati, di norma il portiere.</li>
      <li><b>+${fmtNum(ps)}</b> per ogni rigore parato · <b>−${fmtNum(pm)}</b> per ogni rigore sbagliato.</li>
      <li><b>+${fmtNum(wb)}</b> se la sua squadra vince e lui non ha segnato (vale anche per il portiere). Chi segna prende già il bonus gol, quindi non anche questo.</li>
      <li>Autogol: ${ogm ? `<b>−${fmtNum(ogm)}</b> per ogni autogol` : 'nessun malus (conta solo per il risultato)'}.</li></ul>

      <h3>6. Il ruolo P (portiere)</h3><ul>
      <li>Se il portiere che hai schierato ha giocato, prendi <b>il suo punteggio</b>.</li>
      <li>Se non ha giocato, prendi <b>il punteggio peggiore tra i portieri (GK) che hanno giocato</b> quella partita.</li>
      <li>Se in partita non c'era nessun GK, il ruolo P vale <b>${st('fanta_gk_ufficio')} d'ufficio</b>.</li>
      <li>Se non scegli nessun portiere, il ruolo P vale 0.</li>
      <li>“Ha giocato” = è segnato GK ed è in una delle due squadre della partita.</li></ul>

      <h3>7. Esempi</h3><ul>
      <li>Attaccante: media 6,5, 2 gol, squadra vince → 6,5 + ${fmtNum(2 * gb)} = <b>${fmtNum(ex1)}</b>.</li>
      <li>Portiere: meno di ${st('min_votes')} voti (${st('fanta_voto_ufficio')} d'ufficio), 7 gol subiti, 1 rigore parato, squadra perde → ${st('fanta_voto_ufficio')} − ${fmtNum(Math.floor(7 / cs) * cm)} + ${fmtNum(ps)} = <b>${fmtNum(ex2)}</b>.</li>
      <li>Difensore: media 6,25, nessun gol, squadra vince → 6,25 + ${fmtNum(wb)} = <b>${fmtNum(ex3)}</b>.</li></ul>

      <h3>8. Classifica</h3><ul>
      <li>Punteggio di giornata = somma dei ${lineupSize - 1} di movimento + ruolo P.</li>
      <li>Classifica <b>cumulativa</b> di stagione: si sommano tutte le giornate chiuse. “prov.” = almeno una giornata ha ancora le votazioni aperte.</li>
      <li>A parità di punti vince chi ha <b>più gol segnati dai giocatori schierati</b> (somma su tutte le giornate; il portiere conta solo se ha giocato lui). Poi conta l'<b>ordine alfabetico</b>.</li></ul>

      <h3>9. Correzioni dei presidenti</h3><ul>
      <li>I presidenti possono correggere in ogni momento squadre, gol, risultati e statistiche: punteggi, classifica e quotazioni si ricalcolano da soli.</li>
      <li>Possono riaprire gli schieramenti dopo uno STOP finché la partita non ha il risultato.</li>
      <li>“Annulla giornata fanta” cancella la giornata e tutte le formazioni di quella partita.</li></ul></div>`;
    fv.onclick = null;
  }
}

// ------------------------------------------------------------- ADMIN
async function viewAdmin(v) {
  if (!isPres()) return viewClassifica(v);
  const u = S.ui;
  v.innerHTML = `<div class="section-title"><h2>Area presidente</h2><div class="spacer"></div>${segHtml('aTab', [{ v: 'giocatori', l: 'Giocatori' }, { v: 'quotazioni', l: 'Quotazioni' }, { v: 'stagione', l: 'Stagione' }, { v: 'impostazioni', l: 'Impostazioni' }], u.adminTab)}</div><div id="av"></div>`;
  bindSeg($('#aTab'), val => { u.adminTab = val; viewAdmin(v); });
  const av = $('#av');
  const reloadBoot = async () => { S.boot = await rpc('get_bootstrap', { p_token: T() }); };

  if (u.adminTab === 'giocatori') {
    const ps = [...S.boot.players].sort((a, b) => a.name.localeCompare(b.name, 'it'));
    av.innerHTML = `<div class="card"><div class="row"><input type="text" id="newName" placeholder="Nuovo giocatore (es. Rossi M.)" style="flex:1;min-width:180px"><label class="row small" style="gap:6px"><input type="checkbox" id="newGk"> Portiere (GK)</label><button class="btn primary" id="addP">Aggiungi</button></div>
      <div class="tiny muted" style="margin-top:6px">Il nuovo giocatore al primo accesso sceglie il suo nome dal menu e crea la password.</div></div>
      <div class="row" style="margin-bottom:8px"><input type="text" id="pq" placeholder="Cerca…" style="max-width:240px"><span class="small muted">${ps.filter(p => p.is_active).length} attivi · ${ps.filter(p => p.has_pw).length} con password</span></div>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>Giocatore</th><th>Password</th><th>Stato</th><th></th></tr></thead><tbody id="ptb">
      ${ps.map(p => `<tr data-n="${esc(p.name.toLowerCase())}"><td>${esc(p.name)}${p.is_gk ? ' <span class="pill">GK</span>' : ''}${p.is_president ? ' <span class="pill live">Presidente</span>' : ''}</td><td>${p.has_pw ? '<span class="pill ok">impostata</span>' : '<span class="pill">primo accesso</span>'}</td>
        <td>${p.is_active ? 'attivo' : '<span class="muted">disattivato</span>'}</td><td><button class="btn sm" data-edit="${p.id}">Modifica</button></td></tr>`).join('')}</tbody></table></div>`;
    $('#pq').oninput = e => { const q = e.target.value.toLowerCase(); $$('#ptb tr').forEach(tr => tr.classList.toggle('hidden', !tr.dataset.n.includes(q))); };
    $('#addP').onclick = async () => { const n = $('#newName').value.trim(); if (!n) return; if (await act(() => rpc('admin_add_player', { p_token: T(), p_name: n, p_is_gk: $('#newGk').checked }), 'Giocatore aggiunto')) { await reloadBoot(); S.fanta = S.stats = null; viewAdmin(v); } };
    av.onclick = e => { const b = e.target.closest('[data-edit]'); if (!b) return; const p = S.boot.players.find(x => x.id === Number(b.dataset.edit));
      modal({ title: 'Modifica giocatore', body: `<label class="f">Nome</label><input type="text" id="en" value="${esc(p.name)}">
          <label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" id="ea" ${p.is_active ? 'checked' : ''}> Attivo (se disattivato non compare nel login e nelle liste)</label>
          <label class="row small" style="margin-top:8px;gap:8px"><input type="checkbox" id="eg" ${p.is_gk ? 'checked' : ''}> Portiere (GK): non si compra al fanta, schierabile nel ruolo P</label>
          <label class="row small" style="margin-top:8px;gap:8px"><input type="checkbox" id="ep" ${p.is_president ? 'checked' : ''}> Presidente (accesso completo)</label>
          <p class="small muted" style="margin-top:14px">Password: ${p.has_pw ? 'impostata' : 'non ancora impostata'}. Le password sono cifrate: nessuno può leggerle, si possono solo azzerare.</p>`,
        actions: [
          { label: 'Elimina', cls: 'danger', fn: async () => { if (!await confirmBox(`Eliminare ${esc(p.name)}? Possibile solo se non ha mai giocato.`, 'Elimina', true)) return false; const ok = await act(() => rpc('admin_delete_player', { p_token: T(), p_player: p.id }), 'Eliminato'); if (ok) { await reloadBoot(); viewAdmin(v); } return ok; } },
          { label: 'Azzera password', fn: async () => { if (!await confirmBox(`Azzerare la password di ${esc(p.name)}? Al prossimo accesso ne sceglierà una nuova.`, 'Azzera')) return false; const ok = await act(() => rpc('admin_reset_password', { p_token: T(), p_player: p.id }), 'Password azzerata'); if (ok) { await reloadBoot(); viewAdmin(v); } return ok; } },
          { label: 'Salva', cls: 'primary', fn: async el => { const ok = await act(() => rpc('admin_update_player', { p_token: T(), p_player: p.id, p_name: $('#en', el).value, p_active: $('#ea', el).checked, p_president: $('#ep', el).checked, p_is_gk: $('#eg', el).checked }), 'Salvato'); if (ok) { await reloadBoot(); S.stats = S.fanta = null; viewAdmin(v); } return ok; } },
        ] });
    };
  }

  if (u.adminTab === 'quotazioni') {
    av.innerHTML = '<div class="loader">Caricamento…</div>';
    const F = await loadFanta(true).catch(e => (av.innerHTML = `<div class="empty">${esc(e.message)}</div>`, null)); if (!F) return;
    const cols = [
      { k: 'name', label: 'Giocatore' }, { k: 'price', label: 'Prezzo ora', cls: 'strong' }, { k: 'base', label: 'Base', title: 'Quotazione di inizio stagione (modificabile)' },
      { k: 'season_price', label: 'Da stagione', title: 'Prezzo calcolato solo sui dati della stagione in corso' }, { k: 'efp', label: 'Punti attesi', title: 'Punti fanta attesi per giornata (stagione in corso)' },
      { k: 'pres', label: 'PG' }, { k: 'ed', label: '', fmt: r => S.season === S.boot.active_season ? `<button class="btn sm" data-bp="${r.id}">Base</button>` : '' },
    ];
    const rows = F.prices.map(p => ({ ...p, name: pname(p.id) }));
    const w = rows[0]?.w ?? 0;
    av.innerHTML = `<div class="card small">Prezzo ora = ${Math.round((1 - w) * 100)}% quotazione base + ${Math.round(w * 100)}% prezzo calcolato sulla stagione (il peso della stagione cresce di ${Math.round(100 / settings('price_blend_matches'))}% per ogni partita a 8/11 giocata). Puoi correggere a mano la quotazione base.</div><div id="qt"></div>`;
    const draw = () => { $('#qt').innerHTML = tableHtml(cols, sortRows(rows, u.pricesSort, cols), u.pricesSort); bindSort($('#qt'), u.pricesSort, draw); };
    draw();
    av.onclick = e => { const b = e.target.closest('[data-bp]'); if (!b) return; const r = rows.find(x => x.id === Number(b.dataset.bp));
      modal({ title: 'Quotazione base · ' + r.name, body: `<label class="f">Prezzo di inizio stagione</label><input type="number" min="1" id="bpv" value="${r.base}">`,
        actions: [{ label: 'Salva', cls: 'primary', fn: async el => { const ok = await act(() => rpc('admin_set_base_price', { p_token: T(), p_player: r.id, p_price: Number($('#bpv', el).value) }), 'Quotazione aggiornata'); if (ok) { S.fanta = null; viewAdmin(v); } return ok; } }] }); };
  }

  if (u.adminTab === 'stagione') {
    const act_s = S.boot.seasons.find(s => s.is_active);
    av.innerHTML = `<div class="card"><h2>Stagione attiva: ${esc(act_s?.name || 'nessuna')}</h2>
      <p class="small muted">${act_s?.ended ? 'La stagione è terminata: non si possono creare partite né fare mercato. Puoi riprenderla o avviarne una nuova.' : 'In corso.'}</p>
      <div class="row">${act_s && !act_s.ended ? '<button class="btn danger" id="endS">Termina stagione</button>' : ''}${act_s?.ended ? '<button class="btn" id="resS">Riprendi stagione</button>' : ''}</div></div>
      <div class="card"><h2>Avvia nuova stagione</h2><p class="small muted">Classifiche, voti e FantaNunnaree ripartono da zero. Le quotazioni iniziali saranno quelle di fine stagione attuale. Lo storico resta consultabile dal menu stagione in alto.</p>
      <div class="row"><input type="text" id="sName" placeholder="Es. 2027-28" style="max-width:200px"><button class="btn primary" id="newS">Avvia nuova stagione</button></div></div>`;
    $('#endS') && ($('#endS').onclick = async () => { if (!await confirmBox('Terminare la stagione? Blocca nuove partite e mercato fanta.', 'Termina', true)) return; if (await act(() => rpc('admin_end_season', { p_token: T() }), 'Stagione terminata')) { await reloadBoot(); renderShell(); } });
    $('#resS') && ($('#resS').onclick = async () => { if (await act(() => rpc('admin_resume_season', { p_token: T() }), 'Stagione ripresa')) { await reloadBoot(); renderShell(); } });
    $('#newS').onclick = async () => { const n = $('#sName').value.trim(); if (!n) return toast('Dai un nome alla stagione', true); if (!await confirmBox(`Avviare la stagione ${esc(n)}? La stagione attuale verrà chiusa.`, 'Avvia')) return;
      if (await act(() => rpc('admin_start_season', { p_token: T(), p_name: n }), 'Nuova stagione avviata')) { S.season = null; S.matches = S.stats = S.fanta = S.partners = null; await start(); } };
  }

  if (u.adminTab === 'impostazioni') {
    const keys = Object.keys(S.boot.settings);
    av.innerHTML = `<div class="card"><p class="small muted">Valori usati da voti, statistiche e FantaNunnaree. Le modifiche valgono anche per i calcoli passati.</p>
      ${keys.map(k => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="flex:1;min-width:200px" class="small">${esc(S.boot.settings_labels[k] || k)}</span><input type="number" step="0.25" value="${S.boot.settings[k]}" data-k="${k}" style="width:100px"></div>`).join('')}
      <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn primary" id="saveSet">Salva impostazioni</button></div></div>`;
    $('#saveSet').onclick = async () => {
      for (const i of $$('[data-k]', av)) if (Number(i.value) !== Number(S.boot.settings[i.dataset.k])) {
        if (!await act(() => rpc('admin_update_setting', { p_token: T(), p_key: i.dataset.k, p_value: Number(i.value) }))) return;
      }
      await reloadBoot(); S.stats = S.fanta = null; toast('Impostazioni salvate'); viewAdmin(v);
    };
  }
}

// ------------------------------------------------------------- BOOT
if (S.token) start(); else renderLogin();
</script>
</body>
</html>
